# Paths are relative to the project root.
weights: best.pt
data_root: final_dataset_v4/final_dataset_v4
data_yaml: final_dataset_v4/final_dataset_v4/data.yaml
results_dir: results
seed: 42

detector:
  imgsz: 640
  conf: 0.25        # detection threshold used to pick explanation targets
  iou: 0.7          # NMS IoU (ultralytics default)
  match_iou: 0.5    # detection <-> GT matching

xai:
  # Settings for the explainers (see src/snakeguard/xai/__init__.py: build_explainers)
  occlusion:
    patch_sizes: [48, 96]
    stride_frac: 0.5
    batch: 64
  drise:
    n_masks: 2000
    grid: 16
    p: 0.5
    batch: 64

eval:
  steps: 50               # deletion / insertion curve resolution
  deletion_fill: gray     # gray (114, the YOLO pad value) | blur
  insertion_start: blur
  blur_sigma: 25
  pointing_tolerance: 15  # px in letterboxed space (Zhang et al. 2018)
  topk_frac: 0.2          # for top-k IoU agreement
  noise_std: 0.02         # stability test, in [0,1] pixel units
